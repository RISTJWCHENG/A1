<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的个人视频网站（缩略图 + 搜索）</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#4f46e5;--muted:#94a3b8;--glass:rgba(255,255,255,0.03)}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans",Helvetica,Arial;background:linear-gradient(180deg,#071028 0%, #071b2b 100%);color:#e6eef8}
    .container{max-width:1100px;margin:28px auto;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;margin:0}
    .subtitle{color:var(--muted);font-size:13px}

    .layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}
    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}

    /* player */
    .player-wrap{display:flex;flex-direction:column;gap:12px}
    video#mainVideo{width:100%;border-radius:10px;background:#000;max-height:65vh}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{font-weight:600}
    .btn{background:var(--glass);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;color:inherit;font-size:13px;cursor:pointer}

    /* playlist */
    .playlist-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .search{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .list-title{font-size:14px;color:var(--muted)}
    .video-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
    .video-item:hover{background:rgba(255,255,255,0.02)}
    .thumb{width:112px;height:64px;background:#081226;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .meta-right{flex:1;min-width:0}
    .meta-right .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta-right .small{font-size:12px;color:var(--muted);margin-top:6px}

    footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}

    @media (max-width:900px){
      .layout{grid-template-columns:1fr}
      .container{padding:12px}
      .subtitle{display:none}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>我的个人视频网站</h1>
        <div class="subtitle">支持缩略图（首帧）与搜索过滤 · 纯前端实现</div>
      </div>
      <div class="actions">
        <button class="btn" id="downloadBtn">下载视频</button>
        <button class="btn" id="openInNew">在新标签打开</button>
      </div>
    </header>

    <div class="layout">
      <!-- 主播放器 -->
      <main class="card player-wrap" aria-label="视频播放器">
        <video id="mainVideo" controls playsinline preload="metadata"
          src="https://uploads.productlane.com/809f85154a3c622488669eada7af07fb.mp4">
          您的浏览器不支持 video 标签。
        </video>

        <div class="meta">
          <div>
            <div id="playerTitle" class="title">示例视频</div>
            <div id="playerSource" class="small">来源：ProductLane</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn" id="pipBtn" title="画中画">PIP</button>
            <button class="btn" id="muteBtn" title="静音/取消静音">静音</button>
            <button class="btn" id="restartBtn" title="从头播放">重播</button>
          </div>
        </div>

        <div style="margin-top:6px;color:var(--muted);font-size:13px">
          小提示：若个别缩略图未生成，通常是因为该视频源没有允许跨域（CORS），页面将显示占位图。
        </div>
      </main>

      <!-- 播放列表 -->
      <aside class="card">
        <div class="playlist-header">
          <input id="searchInput" class="search" type="search" placeholder="搜索视频：标题 / 来源 / 关键词" />
          <button class="btn" id="clearBtn" title="清空">清除</button>
        </div>

        <div class="list-title">播放列表（点击切换）</div>
        <div id="playlist" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
          <!-- 列表项由脚本生成 -->
        </div>
      </aside>
    </div>

    <footer>© <span id="year"></span> 我的个人视频网站</footer>
  </div>

  <script>
  // -----------------------
  // 配置：视频列表（按你提供的顺序）
  // 每一项：{ id, title, src, source }
  // -----------------------
  const videos = [
    { id: 'v1', title: 'ProductLane 视频', src: 'https://uploads.productlane.com/809f85154a3c622488669eada7af07fb.mp4', source: 'ProductLane' },
    { id: 'v2', title: 'DSCVR 视频', src: 'https://media.dscvr.one/fetch?media=https%3A%2F%2Fimages.dscvr.one%2Fassets%2F02-18-2025%2F5d2421bb-bcbe-4789-9fbe-839ffc76bd6c.m7b2wl5fqkutihrhgem.mp4#t=0.1', source: 'DSCVR' },
    { id: 'v3', title: 'video3.mp4 (OSS)', src: 'https://ristjianwencheng-career.oss-cn-shanghai.aliyuncs.com/video3.mp4', source: '阿里云 OSS' },
    { id: 'v4', title: 'video2_oss.mp4 (OSS)', src: 'https://ristjianwencheng-career.oss-cn-shanghai.aliyuncs.com/video2.mp4', source: '阿里云 OSS' },
    { id: 'v5', title: 'video1_oss.mp4 (OSS)', src: 'https://ristjianwencheng-career.oss-cn-shanghai.aliyuncs.com/video1.mp4', source: '阿里云 OSS' },
    { id: 'v6', title: '2013_N Dynamic Curves Rigging.mov', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/2013_N%20DYNAMIC%20CURVES%20RIGGING%20SETUP%20TOOL_By-RIST%20JIANWEN%20CHENG.mov', source: 'Cloudflare R2' },
    { id: 'v7', title: 'Italy isn’t just a country', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/Italy%20isn%E2%80%99t%20just%20a%20country%E2%80%94it%E2%80%99s%20a%20feeling%20%20%20%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%20%20The%20first%20bite%20of%20fresh%20pasta%20in%20a%20tiny%20trattoria%20%20Golden%20sunsets%20over%20Tuscan%20hills%20%20Sipping%20wine%20in%20a%20bustling%20piazza%20%20The%20sea%20breeze%20along%20the%20A.mp4', source: 'Cloudflare R2' },
    { id: 'v8', title: 'Art & Light (Rottenbuch)', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/Art%20and%20light%20as%20its%20best!%20%20%20Rottenbuch%20church%20is%20one%20of%20the%20secret%20spots%20in%20Bavaria.%20The%20whole%20architecture%20plays%20with%20the%20reflection%20of%20light.%20It%E2%80%99s%20the%20first%20church%20in%20Bavaria%20in%20the%20style%20of%20rococo..mp4', source: 'Cloudflare R2' },
    { id: 'v9', title: 'Il mare è il mio rifugio', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/Il%20mare%20%C3%A8%20il%20mio%20rifugio%2C%20la%20mia%20bussola%2C%20la%20mia%20cura.%20Tra%20le%20scogliere%20a%20picco%20e%20le%20infinite%20sf%20(5).mp4', source: 'Cloudflare R2' },
    { id: 'v10', title: 'Victorian Home Tour', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/Step%20inside%20this%20charming%20Victorian%20period%20home%20in%20Montpelier%2C%20Bristol%20which%20I%20filmed%20and%20photographed.%20A%20rustic%20and%20fuss%20free%20interior%20on%20this%20one%20-%20I%20do%20love%20a%20painted%20staircase!%20What%20do%20you%20think%20Fo.mp4', source: 'Cloudflare R2' },
    { id: 'v11', title: '2022 Demo Reel Stromae', src: 'https://pub-8231e5ac90c04ce199d0a2879d3ea6ec.r2.dev/2022_Demo%20Reel_Stromae%20-%20Multitude%2C%20le%20film%20-%20The%20concert_By-RIST%20JIANWEN%20CHENG.mov.mov', source: 'Cloudflare R2' }
  ];

  // DOM refs
  const playlistEl = document.getElementById('playlist');
  const mainVideo = document.getElementById('mainVideo');
  const playerTitle = document.getElementById('playerTitle');
  const playerSource = document.getElementById('playerSource');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const openInNew = document.getElementById('openInNew');

  // placeholder SVG data URI (used when thumbnail generation fails)
  const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180">
       <rect width="100%" height="100%" fill="#081226"/>
       <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="14">缩略图不可用</text>
     </svg>`
  );

  // LocalStorage thumbnail cache prefix
  const CACHE_PREFIX = 'video_thumb_'; // keyed by base64 of src

  // utility: safe key
  function cacheKey(src){
    try{ return CACHE_PREFIX + btoa(unescape(encodeURIComponent(src))).slice(0,200); }
    catch(e){ return CACHE_PREFIX + encodeURIComponent(src).slice(0,200); }
  }

  // create list items
  function renderPlaylist(list){
    playlistEl.innerHTML = '';
    list.forEach(item => {
      const el = document.createElement('div');
      el.className = 'video-item';
      el.dataset.src = item.src;
      el.dataset.title = item.title;
      el.dataset.source = item.source;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.alt = item.title;
      img.src = PLACEHOLDER;
      thumb.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'meta-right';
      meta.innerHTML = `<div class="name">${item.title}</div><div class="small">${item.source}</div>`;

      el.appendChild(thumb);
      el.appendChild(meta);
      playlistEl.appendChild(el);

      // click handler to play
      el.addEventListener('click', ()=>{
        setPlaying(item);
      });

      // lazy-generate thumbnail (but attempt cached first)
      generateThumbnail(item.src, img).catch(()=>{ img.src = PLACEHOLDER; });
    });
  }

  // set currently playing video
  function setPlaying(item){
    mainVideo.src = item.src;
    mainVideo.play().catch(()=>{});
    playerTitle.textContent = item.title;
    playerSource.textContent = '来源：' + item.source;
  }

  // thumbnail generation: try cache -> attempt using video+canvas -> fallback
  async function generateThumbnail(src, imgEl){
    const key = cacheKey(src);
    try{
      // try cached
      const cached = localStorage.getItem(key);
      if(cached){
        imgEl.src = cached;
        return;
      }
    }catch(e){ /* ignore localStorage errors */ }

    // attempt to capture frame from video
    // create a hidden video element (crossorigin for CORS-enabled sources)
    return new Promise((resolve, reject)=>{
      const v = document.createElement('video');
      v.crossOrigin = 'anonymous'; // necessary for canvas extraction if server allows CORS
      v.muted = true;
      v.playsInline = true;
      v.preload = 'metadata';
      v.src = src;

      // timeout if cannot load
      let timedOut = false;
      const timeoutId = setTimeout(()=>{ timedOut = true; cleanup(); reject(new Error('timeout')); }, 8000);

      function cleanup(){
        clearTimeout(timeoutId);
        v.pause();
        v.removeAttribute('src');
        try{ v.load(); }catch(e){}
      }

      // on metadata loaded, seek a bit into video to avoid black first frame
      v.addEventListener('loadedmetadata', ()=>{
        // choose a small time but less than duration
        let t = 0.15;
        if (v.duration && v.duration < 0.2) t = 0;
        try{
          v.currentTime = Math.min(t, Math.max(0, (v.duration || t) * 0.01 + t));
        }catch(err){
          // seeking may throw if cross-origin or other; attempt draw at current frame shortly
          setTimeout(captureFrame, 300);
        }
      }, { once:true });

      // on seeked, capture
      v.addEventListener('seeked', captureFrame, { once:true });

      // if video fails to load (CORS or 404)
      v.addEventListener('error', ()=>{
        cleanup();
        reject(new Error('video load error'));
      }, { once:true });

      function captureFrame(){
        if(timedOut){ cleanup(); return reject(new Error('timeout')); }
        try{
          const canvas = document.createElement('canvas');
          const w = Math.min(320, v.videoWidth || 320);
          const h = Math.round(w * ((v.videoHeight || 180) / (v.videoWidth || 320)));
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(v, 0, 0, w, h);

          // convert to data URL
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          // set img and try cache
          imgEl.src = dataUrl;
          try{ localStorage.setItem(key, dataUrl); }catch(e){}
          cleanup();
          resolve();
        }catch(err){
          // drawing to canvas failed likely due to CORS/taint
          cleanup();
          reject(err);
        }
      }
    });
  }

  // search filter
  function applyFilter(keyword){
    keyword = (keyword||'').trim().toLowerCase();
    const items = Array.from(playlistEl.children);
    items.forEach(it=>{
      const title = (it.dataset.title||'').toLowerCase();
      const source = (it.dataset.source||'').toLowerCase();
      if(!keyword || title.includes(keyword) || source.includes(keyword)){
        it.style.display = '';
      } else {
        it.style.display = 'none';
      }
    });
  }

  // initialize
  function init(){
    document.getElementById('year').textContent = new Date().getFullYear();
    renderPlaylist(videos);
    // default first video metadata
    if(videos.length) setPlaying(videos[0]);

    // search handlers
    searchInput.addEventListener('input', (e)=> applyFilter(e.target.value));
    clearBtn.addEventListener('click', ()=>{ searchInput.value=''; applyFilter(''); });

    // download & open
    downloadBtn.addEventListener('click', ()=>{
      const a = document.createElement('a');
      a.href = mainVideo.currentSrc || mainVideo.src;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    openInNew.addEventListener('click', ()=>{
      const url = mainVideo.currentSrc || mainVideo.src;
      window.open(url, '_blank', 'noopener');
    });

    // pip / mute / restart
    document.getElementById('pipBtn').addEventListener('click', async ()=>{
      try{
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await mainVideo.requestPictureInPicture();
      }catch(e){ alert('画中画不可用：' + e.message); }
    });
    document.getElementById('muteBtn').addEventListener('click', ()=>{
      mainVideo.muted = !mainVideo.muted;
      document.getElementById('muteBtn').textContent = mainVideo.muted ? '已静音' : '静音';
    });
    document.getElementById('restartBtn').addEventListener('click', ()=>{ mainVideo.currentTime = 0; mainVideo.play().catch(()=>{}); });

    // keyboard shortcuts
    document.addEventListener('keydown', (e)=>{
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); if(mainVideo.paused) mainVideo.play(); else mainVideo.pause(); }
      if (e.key.toLowerCase() === 'm') mainVideo.muted = !mainVideo.muted;
      if (e.key.toLowerCase() === 'f') { if(document.fullscreenElement) document.exitFullscreen(); else mainVideo.requestFullscreen(); }
    });
  }

  // run
  init();
  </script>
</body>
</html>
